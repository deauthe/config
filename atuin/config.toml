auto_sync = false
update_check = false

search_mode = "fuzzy"
filter_mode = "global"
workspaces = true
filter_mode_shell_up_key_binding = "directory"

style = "compact"
inline_height = 18
show_preview = true
show_help = false
show_tabs = false
invert = false
enter_accept = false
keymap_mode = "vim-insert"
keymap_cursor = { vim_insert = "steady-bar", vim_normal = "steady-block" }

history_filter = [
  "(?i)(password|passwd|secret|token|api[_-]?key)=",
  "^export .*(KEY|TOKEN|SECRET|PASSWORD)",
]
secrets_filter = true

[theme]
name = "default"

[stats]
common_prefix = ["sudo"]
