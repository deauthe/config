# ─── core ──────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:strikethrough:usstyle:overline:sync:extkeys"
set -g extended-keys on
set -g allow-passthrough all
set -g set-clipboard on
set -g focus-events on
set -g escape-time 0
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g display-time 1500
setw -g mode-keys vi
set -g set-titles on
set -g set-titles-string "#S · #W"

# ─── prefix ────────────────────────────────────────────
unbind C-b
set -g prefix C-s
bind -N "Send Ctrl+S to the program" C-s send-prefix

# ─── bindings ──────────────────────────────────────────
bind -N "Reload tmux config" r source-file ~/.config/ghostty/tmux/tmux.conf \; display "config reloaded"
bind -N "New window here (⌘T)" c new-window -c "#{pane_current_path}"
bind -N "Split side by side (⌘D)" | run-shell "~/.config/ghostty/tmux/scripts/split.sh h '#{pane_current_path}'"
bind -N "Split top/bottom (⌘⇧D)" - run-shell "~/.config/ghostty/tmux/scripts/split.sh v '#{pane_current_path}'"
bind -N "Close pane (⌘W)" x kill-pane
bind -N "Clear screen + scrollback (⌘K)" k send-keys C-l \; clear-history
bind -N "Pick session/window (⌘S)" s choose-tree -Zs -O name
bind -N "Focus pane left" h select-pane -L
bind -N "Focus pane down" j select-pane -D
bind -N "Focus pane right" l select-pane -R
bind -N "Resize pane left (repeatable)" -r H resize-pane -L 5
bind -N "Resize pane down (repeatable)" -r J resize-pane -D 3
bind -N "Resize pane up (repeatable)" -r K resize-pane -U 3
bind -N "Resize pane right (repeatable)" -r L resize-pane -R 5
bind -N "Lazygit popup" g display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "lazygit || git status; read -n1"
bind -N "Floating shell popup" t display-popup -E -w 70% -h 60% -d "#{pane_current_path}"
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ─── ghostty ⌘ keys (sent as private escape codes) ────
set -s user-keys[0] "\e[9000~"
set -s user-keys[1] "\e[9001~"
set -s user-keys[2] "\e[9002~"
set -s user-keys[3] "\e[9003~"
set -s user-keys[4] "\e[9004~"
set -s user-keys[7] "\e[9007~"
set -s user-keys[8] "\e[9008~"
set -s user-keys[9] "\e[9009~"
set -s user-keys[10] "\e[9010~"
set -s user-keys[11] "\e[9011~"
set -s user-keys[12] "\e[9012~"
set -s user-keys[13] "\e[9013~"
set -s user-keys[14] "\e[9014~"
set -s user-keys[15] "\e[9015~"
set -s user-keys[16] "\e[9016~"
set -s user-keys[17] "\e[9017~"
bind -n User0 new-window -c "#{pane_current_path}"
bind -n User1 kill-pane
bind -n User2 run-shell "~/.config/ghostty/tmux/scripts/split.sh h '#{pane_current_path}'"
bind -n User3 run-shell "~/.config/ghostty/tmux/scripts/split.sh v '#{pane_current_path}'"
bind -n User4 resize-pane -Z
bind -n User7 send-keys C-l \; clear-history
bind -n User8 choose-tree -Zs -O name
bind -n User9 select-window -t 1
bind -n User10 select-window -t 2
bind -n User11 select-window -t 3
bind -n User12 select-window -t 4
bind -n User13 select-window -t 5
bind -n User14 select-window -t 6
bind -n User15 select-window -t 7
bind -n User16 select-window -t 8
bind -n User17 select-window -t 9

set -s user-keys[18] "\e[9018~"
bind -n User18 copy-mode \; command-prompt -i -p "find ↑" "send -X search-backward-incremental \"%%%\""
bind -T copy-mode-vi User18 command-prompt -i -p "find ↑" "send -X search-backward-incremental \"%%%\""

# ─── notifications ─────────────────────────────────────
set -g bell-action any
set-hook -g alert-bell 'run-shell -b "~/.config/ghostty/tmux/scripts/notify.sh \"#{session_name} · #{window_name}\" \"Bell in window #{window_index}\" #{pane_id} skip-if-visible"'

# ─── panes ─────────────────────────────────────────────
set -g pane-border-lines single
set -g pane-border-style "fg=#4b505d"
set -g pane-active-border-style "fg=#a2b2d6"
set -g window-style "fg=#8a909c"
set -g window-active-style "fg=default"
set -g pane-border-indicators off
set -g popup-border-lines rounded
set -g popup-border-style "fg=#5c6270"
set -g popup-style "bg=default"
set -g message-style "bg=default,fg=#a2b2d6"
set -g message-command-style "bg=default,fg=#a2b2d6"
setw -g mode-style "bg=#262b36,fg=#e8eaef"
setw -g clock-mode-colour "#a2b2d6"
set -g display-panes-active-colour "#a2b2d6"
set -g display-panes-colour "#5c6270"

# ─── status bar ────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 3
set -g status-justify absolute-centre
set -g status-style "bg=default,fg=#8a909c"
set -g status-left-length 60
set -g status-right-length 140

set -g status-left "\
#{?client_prefix,#[fg=#0b0d12#,bg=#cfb98f#,bold] PREFIX #[bg=default#,nobold] ,#{?pane_in_mode,#[fg=#0b0d12#,bg=#a2b2d6#,bold] COPY #[bg=default#,nobold] ,#[fg=#5c6270] 󰆍 }}\
#[fg=#c8ccd4,bold]#S#[nobold]\
#{?window_zoomed_flag,#[fg=#cfb98f]  󰊓 zoom,}\
#{?pane_synchronized,#[fg=#cfb98f]  󰓦 sync,}\
#{?#{e|>=:#{client_width},110},#[fg=#5c6270]  󰉋 #{b:pane_current_path},} "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#5c6270]  #I #W#{?window_activity_flag,#[fg=#cfb98f] •,}  "
setw -g window-status-current-format "#[fg=#c8ccd4,bold]  #I #W  #[nobold]"
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style "none"
setw -g window-status-bell-style "fg=#cfb98f"
setw -g automatic-rename on
setw -g automatic-rename-format "#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}"

set -g status-right "\
#{?#{e|>=:#{client_width},90},#[fg=#8a909c]#(~/.config/ghostty/tmux/scripts/git.sh '#{pane_current_path}' #{?#{e|>=:#{client_width},140},32,16})  ,}\
#{?#{e|>=:#{client_width},150},#[fg=#5c6270]󰻠 #[fg=#8a909c]#(~/.config/ghostty/tmux/scripts/cpu.sh)  #[fg=#5c6270]󰍛 #[fg=#8a909c]#(~/.config/ghostty/tmux/scripts/mem.sh)  ,}\
#{?#{e|>=:#{client_width},120},#[fg=#8a909c]#(~/.config/ghostty/tmux/scripts/battery.sh)  ,}\
#{?#{e|>=:#{client_width},110},#[fg=#5c6270]󰃭 %a %d  ,}\
#[fg=#c8ccd4,bold]%H:%M "
